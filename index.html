<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Malaika</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        overflow:hidden;
        background: linear-gradient(135deg,#ff9ecf,#ffd6e8);
        height:100vh;
    }

    .page{
        width:100%;
        height:100vh;
        display:none;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        text-align:center;
        padding:20px;
    }

    .active{
        display:flex;
    }

    h1{
        font-size:55px;
        color:white;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow{
        from{
            text-shadow:0 0 10px white;
        }
        to{
            text-shadow:0 0 25px #ff0080;
        }
    }

    .boy{
        font-size:120px;
        margin-top:20px;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float{
        0%{transform:translateY(0px);}
        50%{transform:translateY(-20px);}
        100%{transform:translateY(0px);}
    }

    button{
        margin-top:30px;
        padding:15px 35px;
        border:none;
        border-radius:30px;
        background:white;
        color:#ff1493;
        font-size:20px;
        cursor:pointer;
        transition:0.3s;
        font-weight:bold;
    }

    button:hover{
        transform:scale(1.1);
        background:#ff1493;
        color:white;
    }

    .text{
        font-size:40px;
        color:white;
        animation: fadeIn 2s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .cat{
        font-size:120px;
        animation: shake 1s infinite;
    }

    @keyframes shake{
        0%{transform:rotate(0deg);}
        25%{transform:rotate(5deg);}
        50%{transform:rotate(0deg);}
        75%{transform:rotate(-5deg);}
        100%{transform:rotate(0deg);}
    }

    .flower{
        font-size:80px;
        margin-top:10px;
    }

    .please{
        margin-top:15px;
        font-size:35px;
        color:white;
    }

    .note{
        font-size:28px;
        color:white;
        max-width:700px;
        animation: fadeIn 2s ease;
        line-height:1.6;
    }

</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>🎉 Happy Birthday Malaika 🎉</h1>

    <div class="boy">🧑</div>

    <button onclick="nextPage('page2')">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">

    <div class="text">
        There is a surprise for you ❤️<br><br>
        You wanna see?
    </div>

    <div>
        <button onclick="nextPage('page4')">Yes 💖</button>
        <button onclick="nextPage('page3')">No 😭</button>
    </div>

</div>

<!-- PAGE 3 -->
<div class="page" id="page3">

    <div class="cat">😿</div>

    <div class="flower">🌻</div>

    <div class="please">
        Please Pretty 🥺
    </div>

    <button onclick="nextPage('page4')">Okay Fine 💕</button>

</div>

<!-- PAGE 4 -->
<div class="page" id="page4">

    <div class="note">
        <!-- WRITE YOUR NOTE HERE -->

        Dear Malaika ❤️<br><br>

        Happy Birthday to the most special person ever 🎂✨<br>
        I hope your day becomes as beautiful and amazing as your smile.<br><br>

        (Write your own note here)

    </div>

</div>

<script>

function nextPage(pageId){

    let pages = document.querySelectorAll('.page');

    pages.forEach(page=>{
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');
}

</script>

</body>
</html>
